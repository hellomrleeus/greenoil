name: Deploy Dev Subpath to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "gh-pages-deploy"
  cancel-in-progress: false

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Prepare dev deployment artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          [ -f .nojekyll ] && cp .nojekyll _site/

      - name: Deploy to GitHub Pages (/dev subpath)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          destination_dir: dev
          keep_files: true
